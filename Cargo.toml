[package]
name = "renfield"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hex = "0.4.3"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
